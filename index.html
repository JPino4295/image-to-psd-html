<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Lineart PSD Generator</title>
    <script src="https://cdn.jsdelivr.net/npm/ag-psd@14/dist/bundle.js"></script>
</head>
<body style="font-family: sans-serif; padding: 20px; background: #f4f4f9;">
    <div style="background: white; padding: 20px; border-radius: 8px; max-width: 500px; border: 1px solid #ccc;">
        <h2>Image to PSD Separator</h2>
        <p>Select your grayscale image. This script will extract the lineart to a transparent layer, create a white background layer, and generate your PSD.</p>
        
        <input type="file" id="imageInput" accept="image/*" style="margin-bottom: 15px;" />
        <p id="status" style="font-weight: bold; color: #333;"></p>
    </div>

    <script>
        document.getElementById('imageInput').addEventListener('change', function(e) {
            const file = e.target.files[0];
            if (!file) return;

            const status = document.getElementById('status');
            status.innerText = 'Processing image...';

            const img = new Image();
            img.onload = function() {
                try {
                    const width = img.width;
                    const height = img.height;

                    // Setup Background Layer
                    const bgCanvas = document.createElement('canvas');
                    bgCanvas.width = width; bgCanvas.height = height;
                    const bgCtx = bgCanvas.getContext('2d');
                    bgCtx.fillStyle = '#ffffff';
                    bgCtx.fillRect(0, 0, width, height);

                    // Setup Lineart Layer
                    const lineCanvas = document.createElement('canvas');
                    lineCanvas.width = width; lineCanvas.height = height;
                    const lineCtx = lineCanvas.getContext('2d');
                    lineCtx.drawImage(img, 0, 0);

                    // Read pixel data to separate lines from the background
                    const imgData = lineCtx.getImageData(0, 0, width, height);
                    const data = imgData.data;
                    
                    // Offset of 4 due to RGB
                    for (let i = 0; i < data.length; i += 4) {
                        const r = data.at(i);
                        const g = data.at(i+1);
                        const b = data.at(i+2);
                        
                        // Calculate luminance to get darkness
                        const luminance = 0.299 * r + 0.587 * g + 0.114 * b;
                        
                        // Convert to pure black, using the original darkness as the opacity (RGBA)
                        data[i] = 0;     // R
                        data[i+1] = 0;   // G
                        data[i+2] = 0;   // B
                        data[i+3] = 255 - luminance; // Alpha
                    }

                    lineCtx.putImageData(imgData, 0, 0);

                    // Define the PSD document structure (Bottom to Top)
                    status.innerText = 'Generating PSD...';
                    const psd = {
                        width: width,
                        height: height,
                        children: [
                            {
                                name: 'Background',
                                canvas: bgCanvas
                            },
                            {
                                name: 'Lineart',
                                canvas: lineCanvas
                            }
                        ]
                    };

                    // Write to binary buffer and trigger browser download
                    const buffer = agPsd.writePsd(psd);
                    const blob = new Blob([buffer], { type: 'application/octet-stream' });
                    const url = URL.createObjectURL(blob);

                    const link = document.createElement('a');
                    link.href = url;
                    link.download = 'extracted_lineart.psd';
                    document.body.appendChild(link);
                    link.click();
                    document.body.removeChild(link);

                    status.innerText = 'PSD generated and downloaded! You can now drag it into Photopea.';
                } catch (error) {
                    status.innerText = 'Error generating PSD: ' + error.message;
                }
            };
            // Load the chosen image into the script
            img.src = URL.createObjectURL(file);
        });
    </script>
</body>
</html>
